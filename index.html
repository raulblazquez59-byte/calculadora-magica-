<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Calculadora">
<title>Calculadora</title>
<style>
:root{--bg:#000;--key:#333;--key2:#505050;--op:#ff9f0a;--text:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;height:100%;overflow:hidden}
body{display:flex;justify-content:center}
.app{width:min(100vw,430px);height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:#000}
.display{height:34%;min-height:190px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 18px;overflow:hidden}
.value{font-size:clamp(58px,18vw,92px);font-weight:300;letter-spacing:-3px;white-space:nowrap;max-width:100%;overflow:hidden;text-align:right}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-bottom:10px}
button{border:0;border-radius:50%;aspect-ratio:1/1;background:var(--key);color:#fff;font-size:clamp(26px,8vw,36px);font-weight:400;font-family:inherit;touch-action:manipulation}
button:active{filter:brightness(1.35)}
button.function{background:#a5a5a5;color:#000}
button.operator{background:var(--op);font-size:34px}
button.operator.active{color:var(--op);background:#fff}
button.zero{grid-column:span 2;aspect-ratio:auto;border-radius:50px;text-align:left;padding-left:30px}
.small{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 5px);font-size:10px;color:#555;opacity:.0}
#panel{position:fixed;inset:auto 12px calc(env(safe-area-inset-bottom) + 8px);background:#1c1c1e;color:#fff;border-radius:18px;padding:14px;display:none;font-size:14px;z-index:10;box-shadow:0 5px 30px #000}
#panel label{display:block;margin:5px 0;color:#bbb}
#target{width:100%;background:#2c2c2e;color:#fff;border:1px solid #555;border-radius:10px;padding:9px;font-size:16px}
#panel .row{display:flex;gap:8px;margin-top:9px}
#panel button{aspect-ratio:auto;border-radius:10px;padding:9px 12px;font-size:14px;background:#444}
#panel button.primary{background:#ff9f0a;color:#000}
.hint{font-size:12px;color:#aaa;margin-top:7px;line-height:1.3}
</style>
</head>
<body>
<div class="app">
  <div class="display"><div id="display" class="value">0</div></div>
  <div class="keys">
    <button class="function" onclick="clearAll()">AC</button>
    <button class="function" onclick="toggleSign()">±</button>
    <button class="function" onclick="percent()">%</button>
    <button class="operator" data-op="÷" onclick="pressOp('÷')">÷</button>

    <button onclick="digit('7')">7</button><button onclick="digit('8')">8</button><button onclick="digit('9')">9</button>
    <button class="operator" data-op="×" onclick="pressOp('×')">×</button>

    <button onclick="digit('4')">4</button><button onclick="digit('5')">5</button><button onclick="digit('6')">6</button>
    <button class="operator" data-op="−" onclick="pressOp('−')">−</button>

    <button onclick="digit('1')">1</button><button onclick="digit('2')">2</button><button onclick="digit('3')">3</button>
    <button class="operator" data-op="+" id="plus" onclick="pressPlus()">+</button>

    <button class="zero" onclick="digit('0')">0</button><button onclick="decimal()">.</button><button class="operator" onclick="equals()">=</button>
  </div>
</div>

<div id="panel">
  <b>Modo mago</b>
  <label>Objetivo: fecha + hora actual</label>
  <input id="target" readonly>
  <div class="hint">Formato: día + mes + año (2 cifras) + hora + minuto. Ej.: 28/08/26 22:01 → 288262201.</div>
  <div class="row"><button class="primary" onclick="closePanel()">Cerrar</button><button onclick="setCustom()">Objetivo manual</button></div>
</div>

<script>
let cur="0", stored=null, op=null, waiting=false, justForced=false, lastPlus=0;
const d=document.getElementById("display");

function fmt(x){
  if(!Number.isFinite(Number(x))) return "Error";
  let s=String(x);
  if(s.includes("e")) return s;
  if(s.endsWith(".0")) s=s.slice(0,-2);
  return s;
}
function render(){d.textContent=cur}
function digit(n){
  if(waiting || cur==="0" || justForced){cur=n;waiting=false;justForced=false}
  else if(cur.replace("-","").replace(".","").length<12) cur+=n;
  render();
}
function decimal(){if(waiting||justForced){cur="0.";waiting=false;justForced=false}else if(!cur.includes("."))cur+=".";render()}
function clearAll(){cur="0";stored=null;op=null;waiting=false;justForced=false;render();setActive()}
function toggleSign(){if(cur!=="0")cur=cur.startsWith("-")?cur.slice(1):"-"+cur;render()}
function percent(){cur=String(Number(cur)/100);render()}
function calc(a,b,o){
  a=Number(a);b=Number(b);
  if(o==="+")return a+b;if(o==="−")return a-b;if(o==="×")return a*b;if(o==="÷")return b===0?NaN:a/b;
}
function pressOp(o){
  if(stored!==null && op && !waiting){stored=calc(stored,cur,op);cur=fmt(stored)}
  else stored=Number(cur);
  op=o;waiting=true;justForced=false;setActive();
}
function pressPlus(){
  const now=Date.now();
  const double=now-lastPlus<500;
  lastPlus=now;
  if(double && (op==="+" || op===null)){
    forceTarget();
    return;
  }
  pressOp("+");
}
function targetNumber(){
  const n=new Date();
  const day=n.getDate();
  const month=n.getMonth()+1;
  const yy=String(n.getFullYear()).slice(-2);
  const hh=String(n.getHours()).padStart(2,"0");
  const mm=String(n.getMinutes()).padStart(2,"0");
  return `${day}${month}${yy}${hh}${mm}`;
}
function forceTarget(){
  // If a sum is already active, choose the exact next addend.
  // If no sum is active, treat the current displayed value as the accumulated total.
  const target=Number(targetNumber());
  let base;
  if(stored!==null && op==="+") base=stored;
  else base=Number(cur);
  const needed=target-base;
  cur=fmt(needed);
  op="+";
  stored=base;
  waiting=false;
  justForced=true;
  render();
  setActive();
}
function equals(){
  if(stored===null||!op)return;
  cur=fmt(calc(stored,cur,op));stored=null;op=null;waiting=false;justForced=false;setActive();
}
function setActive(){
  document.querySelectorAll(".operator").forEach(x=>x.classList.toggle("active",x.dataset.op===op));
}
document.addEventListener("keydown",e=>{
  if(/[0-9]/.test(e.key))digit(e.key);
  else if(e.key==="+")pressOp("+"); else if(e.key==="Enter"||e.key==="=")equals();
  else if(e.key==="Escape")clearAll();
});
let lp=0;
document.body.addEventListener("touchend",()=>{
  // no-op; the + button uses its own double tap timing
});
setInterval(()=>{
  document.getElementById("target").value=targetNumber();
},250);
</script>
</body>
</html>
