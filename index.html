<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">
<title>Calculadora</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
              "SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
body{
  overflow:hidden;
}
.calculator{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:15px 12px calc(12px + env(safe-area-inset-bottom));
}
/* =========================
   PANTALLA
========================= */
.display{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:10px 8px 18px;
  overflow:hidden;
}
.history{
  width:100%;
  max-height:40%;
  overflow-y:auto;
  text-align:right;
  color:#777;
  font-size:19px;
  line-height:1.45;
  margin-bottom:8px;
}
.expression{
  width:100%;
  min-height:32px;
  text-align:right;
  color:#999;
  font-size:25px;
  white-space:nowrap;
  overflow-x:auto;
}
.result{
  width:100%;
  text-align:right;
  color:#fff;
  font-size:clamp(48px,14vw,88px);
  font-weight:300;
  line-height:1;
  white-space:nowrap;
  overflow-x:auto;
  margin-top:6px;
}
/* =========================
   TECLADO
========================= */
.keypad{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  width:100%;
}
button{
  border:0;
  height:clamp(65px,17vw,90px);
  border-radius:50%;
  font-size:clamp(25px,7vw,36px);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .08s;
}
button:active{
  transform:scale(.91);
}
.number{
  background:#333;
  color:#fff;
}
.function{
  background:#a5a5a5;
  color:#000;
}
.operator{
  background:#ff9500;
  color:#fff;
}
.operator.active{
  background:#fff;
  color:#ff9500;
}
.zero{
  grid-column:span 2;
  border-radius:50px;
  text-align:left;
  padding-left:28px;
}
/* =========================
   PANEL SECRETO
========================= */
.magic-panel{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:calc(100% - 30px);
  max-width:430px;
  background:#181818;
  border-radius:24px;
  padding:24px 20px;
  box-shadow:0 15px 60px rgba(0,0,0,.7);
  z-index:100;
  display:none;
}
.magic-panel.show{
  display:block;
}
.magic-title{
  font-size:22px;
  font-weight:600;
  text-align:center;
  margin-bottom:20px;
}
.magic-label{
  color:#888;
  font-size:14px;
  margin-top:12px;
}
.magic-number{
  font-size:28px;
  text-align:center;
  margin-top:5px;
  word-break:break-all;
}
.magic-final{
  font-size:32px;
  text-align:center;
  margin-top:5px;
  font-weight:500;
  word-break:break-all;
}
.close-button{
  width:100%;
  height:55px;
  border-radius:18px;
  background:#ff9500;
  color:#fff;
  font-size:20px;
  margin-top:22px;
}
</style>
</head>
<body>
<div class="calculator">
  <div class="display">
    <div id="history" class="history"></div>
    <div id="expression" class="expression"></div>
    <div id="result" class="result">0</div>
  </div>
  <div class="keypad">
    <button class="function" onclick="clearAll()">AC</button>
    <button class="function" onclick="toggleSign()">±</button>
    <button class="function" onclick="percent()">%</button>
    <button class="operator"
            data-op="/"
            onclick="operator('/')">÷</button>
    <button class="number"
            onclick="number('7')">7</button>
    <button class="number"
            onclick="number('8')">8</button>
    <button class="number"
            onclick="number('9')">9</button>
    <button class="operator"
            data-op="*"
            onclick="operator('*')">×</button>
    <button class="number"
            onclick="number('4')">4</button>
    <button class="number"
            onclick="number('5')">5</button>
    <button class="number"
            onclick="number('6')">6</button>
    <button class="operator"
            data-op="-"
            onclick="operator('-')">−</button>
    <button class="number"
            onclick="number('1')">1</button>
    <button class="number"
            onclick="number('2')">2</button>
    <button class="number"
            onclick="number('3')">3</button>
    <button class="operator"
            data-op="+"
            onclick="operator('+')">+</button>
    <button class="number zero"
            onclick="number('0')">0</button>
    <button class="number"
            onclick="decimal()">,</button>
    <button class="operator"
            onclick="equals()">=</button>
  </div>
</div>
<!--
  PANEL SECRETO.
  Solo aparece al pulsar "=" dos veces seguidas.
-->
<div id="magicPanel" class="magic-panel">
  <div class="magic-title">
    🎩 Número final del truco
  </div>
  <div class="magic-label">
    Número que llevabas
  </div>
  <div id="magicCurrent" class="magic-number">
    0
  </div>
  <div class="magic-label">
    NÚMERO QUE TIENES QUE DECIR
  </div>
  <div id="magicMissing" class="magic-number">
    0
  </div>
  <div class="magic-label">
    Resultado final
  </div>
  <div id="magicFinal" class="magic-final">
    0
  </div>
  <div class="magic-label" style="text-align:center">
    Fecha y hora
  </div>
  <div id="magicDate" class="magic-final">
    --
  </div>
  <button class="close-button"
          onclick="closeMagic()">
    Continuar
  </button>
</div>
<script>
/* =====================================================
   ESTADO
===================================================== */
let current = "0";
let previous = null;
let currentOperator = null;
let waitingForOperand = false;
let expressionParts = [];
let accumulatedTotal = null;
/*
  Control del doble "="
*/
let lastEqualsTime = 0;
/* =====================================================
   ELEMENTOS
===================================================== */
const resultEl =
  document.getElementById("result");
const expressionEl =
  document.getElementById("expression");
const historyEl =
  document.getElementById("history");
const magicPanel =
  document.getElementById("magicPanel");
const magicCurrent =
  document.getElementById("magicCurrent");
const magicMissing =
  document.getElementById("magicMissing");
const magicFinal =
  document.getElementById("magicFinal");
const magicDate =
  document.getElementById("magicDate");
/* =====================================================
   FORMATO
===================================================== */
function formatNumber(value){
  if(!Number.isFinite(value)){
    return "Error";
  }
  return value.toLocaleString("es-ES",{
    maximumFractionDigits:10,
    useGrouping:true
  });
}
/* =====================================================
   ACTUALIZAR PANTALLA
===================================================== */
function updateDisplay(){
  if(current.includes(".")){
    resultEl.textContent =
      current.replace(".",",");
  }else{
    resultEl.textContent =
      formatNumber(Number(current));
  }
  expressionEl.textContent =
    expressionParts.join(" ");
}
/* =====================================================
   NÚMEROS
===================================================== */
function number(num){
  if(current === "Error"){
    current="0";
  }
  if(waitingForOperand){
    current=num;
    waitingForOperand=false;
  }else{
    if(current==="0"){
      current=num;
    }else{
      current+=num;
    }
  }
  updateDisplay();
}
/* =====================================================
   DECIMAL
===================================================== */
function decimal(){
  if(waitingForOperand){
    current="0.";
    waitingForOperand=false;
  }else if(!current.includes(".")){
    current+=".";
  }
  updateDisplay();
}
/* =====================================================
   OPERADORES
===================================================== */
function operator(op){
  const value=Number(current);
  if(currentOperator && waitingForOperand){
    currentOperator=op;
    expressionParts[
      expressionParts.length-1
    ]=operatorSymbol(op);
    updateDisplay();
    return;
  }
  if(previous===null){
    previous=value;
  }else if(currentOperator){
    const calculated=
      calculate(
        previous,
        value,
        currentOperator
      );
    current=String(calculated);
    previous=calculated;
  }
  currentOperator=op;
  waitingForOperand=true;
  expressionParts.push(
    formatNumber(value)
  );
  expressionParts.push(
    operatorSymbol(op)
  );
  updateDisplay();
  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
  const active=
    document.querySelector(
      `.operator[data-op="${op}"]`
    );
  if(active){
    active.classList.add("active");
  }
}
/* =====================================================
   SÍMBOLOS
===================================================== */
function operatorSymbol(op){
  if(op==="+") return "+";
  if(op==="-") return "−";
  if(op==="*") return "×";
  if(op==="/") return "÷";
  return op;
}
/* =====================================================
   CÁLCULO
===================================================== */
function calculate(a,b,op){
  if(op==="+"){
    return a+b;
  }
  if(op==="-"){
    return a-b;
  }
  if(op==="*"){
    return a*b;
  }
  if(op==="/"){
    return b===0 ? NaN : a/b;
  }
  return b;
}
/* =====================================================
   IGUAL
===================================================== */
function equals(){
  const now =
    Date.now();
  /*
    Si pulsamos "=" dos veces seguidas,
    activamos el modo secreto.
  */
  const doubleEquals =
    (now-lastEqualsTime <= 1000);
  lastEqualsTime=now;
  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
  /*
    PRIMER "="
    -----------------
    Calculadora normal.
  */
  if(currentOperator!==null &&
     previous!==null){
    const operand=
      Number(current);
    const oldPrevious=
      previous;
    const oldOperator=
      currentOperator;
    const result=
      calculate(
        oldPrevious,
        operand,
        oldOperator
      );
    historyEl.innerHTML +=
      `<div>
        ${formatNumber(oldPrevious)}
        ${operatorSymbol(oldOperator)}
        ${formatNumber(operand)}
        =
        ${formatNumber(result)}
      </div>`;
    current=
      String(result);
    accumulatedTotal=
      result;
    previous=null;
    currentOperator=null;
    waitingForOperand=true;
    expressionParts=[];
    updateDisplay();
  }else{
    /*
      Si no hay operación pendiente,
      el número actual se conserva.
    */
    accumulatedTotal=
      Number(current);
    waitingForOperand=true;
    updateDisplay();
  }
  /*
    SOLO EL SEGUNDO "="
    ejecuta el truco.
  */
  if(doubleEquals){
    ejecutarTruco();
  }
}
/* =====================================================
   FECHA Y HORA OBJETIVO
===================================================== */
function getTarget(){
  const now =
    new Date();
  const day =
    String(now.getDate())
      .padStart(2,"0");
  const month =
    String(now.getMonth()+1)
      .padStart(2,"0");
  const year =
    String(now.getFullYear());
  const hour =
    String(now.getHours())
      .padStart(2,"0");
  const minute =
    String(now.getMinutes())
      .padStart(2,"0");
  /*
    FORMATO:
    DDMMYYYYHHMM
    Ejemplo:
    27/09/2026 01:57
    270920260157
  */
  const targetString =
    day +
    month +
    year +
    hour +
    minute;
  return {
    number:
      Number(targetString),
    string:
      targetString,
    readable:
      `${day}/${month}/${year} ${hour}:${minute}`
  };
}
/* =====================================================
   TRUCO
===================================================== */
function ejecutarTruco(){
  let currentTotal =
    Number(accumulatedTotal);
  if(!Number.isFinite(currentTotal)){
    currentTotal=0;
  }
  const target =
    getTarget();
  const targetNumber =
    target.number;
  /*
    NÚMERO QUE FALTA:
    OBJETIVO - TOTAL ACTUAL
  */
  const missing =
    targetNumber-currentTotal;
  /*
    Si el número ya es demasiado grande,
    no hacemos ninguna operación extraña.
  */
  if(missing<0){
    return;
  }
  const missingInteger =
    Math.trunc(missing);
  /*
    Datos que solo ve el propietario
    cuando activa el segundo "=".
  */
  magicCurrent.textContent =
    formatNumber(currentTotal);
  magicMissing.textContent =
    String(missingInteger);
  magicFinal.textContent =
    target.string;
  magicDate.textContent =
    target.readable;
  /*
    La calculadora muestra también
    el resultado final.
  */
  expressionEl.textContent =
    `${formatNumber(currentTotal)} + ${missingInteger}`;
  resultEl.textContent =
    target.string;
  /*
    Abrimos el panel secreto.
  */
  magicPanel.classList.add("show");
}
/* =====================================================
   CERRAR PANEL
===================================================== */
function closeMagic(){
  magicPanel.classList.remove("show");
}
/* =====================================================
   AC
===================================================== */
function clearAll(){
  current="0";
  previous=null;
  currentOperator=null;
  waitingForOperand=false;
  expressionParts=[];
  accumulatedTotal=null;
  lastEqualsTime=0;
  historyEl.innerHTML="";
  expressionEl.textContent="";
  resultEl.textContent="0";
  magicPanel.classList.remove("show");
  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
}
/* =====================================================
   +/-
===================================================== */
function toggleSign(){
  if(current==="0"){
    return;
  }
  if(current.startsWith("-")){
    current=
      current.substring(1);
  }else{
    current=
      "-"+current;
  }
  updateDisplay();
}
/* =====================================================
   %
===================================================== */
function percent(){
  const value=
    Number(current);
  current=
    String(value/100);
  updateDisplay();
}
/* =====================================================
   TECLADO
===================================================== */
document.addEventListener(
  "keydown",
  function(e){
    if(e.key>="0" && e.key<="9"){
      number(e.key);
    }
    if(e.key==="."){
      decimal();
    }
    if(e.key==="+"){
      operator("+");
    }
    if(e.key==="-"){
      operator("-");
    }
    if(e.key==="*"){
      operator("*");
    }
    if(e.key==="/"){
      e.preventDefault();
      operator("/");
    }
    if(e.key==="Enter" || e.key==="="){
      equals();
    }
    if(e.key==="Escape"){
      clearAll();
    }
    if(e.key==="%"){
      percent();
    }
  }
);
/* =====================================================
   INICIO
===================================================== */
updateDisplay();
</script>
</body>
</html>
