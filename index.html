<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,
              BlinkMacSystemFont,
              "SF Pro Display",
              "Helvetica Neue",
              Arial,
              sans-serif;
}
body{
  overflow:hidden;
}
.calculator{
  width:100%;
  height:100dvh;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:
    0 12px
    calc(12px + env(safe-area-inset-bottom));
}
/* =========================
   PANTALLA
========================= */
.display{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:10px 8px 18px;
  overflow:hidden;
}
.history{
  width:100%;
  max-height:30%;
  overflow:hidden;
  text-align:right;
  color:#777;
  font-size:18px;
  line-height:1.4;
  margin-bottom:6px;
}
.expression{
  width:100%;
  min-height:30px;
  text-align:right;
  color:#888;
  font-size:23px;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  margin-bottom:4px;
}
.result{
  width:100%;
  text-align:right;
  color:#fff;
  font-size:clamp(46px,13vw,76px);
  font-weight:300;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  margin:0;
}
/* =========================
   TECLADO
========================= */
.keypad{
  width:100%;
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  grid-template-rows:
    repeat(5,minmax(0,1fr));
  gap:10px;
  padding-bottom:2px;
}
button{
  width:100%;
  aspect-ratio:1 / 1;
  border:0;
  border-radius:50%;
  font-family:inherit;
  font-size:clamp(25px,7vw,34px);
  cursor:pointer;
  touch-action:manipulation;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  transition:transform .08s ease;
}
button:active{
  transform:scale(.91);
}
.number{
  background:#333;
  color:#fff;
}
.function{
  background:#a5a5a5;
  color:#000;
}
.operator{
  background:#ff9500;
  color:#fff;
}
.operator.active{
  background:#fff;
  color:#ff9500;
}
.zero{
  grid-column:span 2;
  aspect-ratio:auto;
  border-radius:50px;
  justify-content:flex-start;
  padding-left:28px;
}
/* =========================
   PANEL PRIVADO % %
========================= */
.private-panel{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:calc(100% - 40px);
  max-width:360px;
  background:#181818;
  border-radius:22px;
  padding:25px 20px;
  box-shadow:
    0 15px 60px rgba(0,0,0,.8);
  z-index:100;
  display:none;
}
.private-title{
  text-align:center;
  font-size:20px;
  font-weight:600;
  margin-bottom:22px;
}
.private-label{
  text-align:center;
  color:#888;
  font-size:14px;
  margin-bottom:5px;
}
.private-number{
  text-align:center;
  font-size:30px;
  word-break:break-all;
  margin-bottom:22px;
}
.private-result{
  text-align:center;
  font-size:27px;
  word-break:break-all;
}
.private-close{
  width:100%;
  height:55px;
  border-radius:18px;
  background:#ff9500;
  color:#fff;
  font-size:19px;
  margin-top:25px;
}
/* =========================
   PANTALLAS PEQUEÑAS
========================= */
@media(max-height:700px){
  .calculator{
    padding-left:9px;
    padding-right:9px;
  }
  .display{
    padding-bottom:10px;
  }
  .keypad{
    gap:7px;
  }
  button{
    font-size:25px;
  }
  .result{
    font-size:46px;
  }
}
/* =========================
   PANTALLAS GRANDES
========================= */
@media(min-width:600px){
  .calculator{
    max-width:430px;
    margin:0 auto;
  }
  .keypad{
    gap:12px;
  }
}
</style>
</head>
<body>
<div class="calculator">
  <div class="display">
<div id="history"
     class="history"></div>
<div id="expression"
     class="expression"></div>
<div id="result"
     class="result">0</div>
  </div>
  <div class="keypad">
<button
  class="function"
  onclick="clearAll()">AC</button>
<button
  class="function"
  onclick="toggleSign()">±</button>
<button
  class="function"
  onclick="percent()">%</button>
<button
  class="operator"
  data-op="/"
  onclick="operator('/')">÷</button>
<button
  class="number"
  onclick="number('7')">7</button>
<button
  class="number"
  onclick="number('8')">8</button>
<button
  class="number"
  onclick="number('9')">9</button>
<button
  class="operator"
  data-op="*"
  onclick="operator('*')">×</button>
<button
  class="number"
  onclick="number('4')">4</button>
<button
  class="number"
  onclick="number('5')">5</button>
<button
  class="number"
  onclick="number('6')">6</button>
<button
  class="operator"
  data-op="-"
  onclick="operator('-')">−</button>
<button
  class="number"
  onclick="number('1')">1</button>
<button
  class="number"
  onclick="number('2')">2</button>
<button
  class="number"
  onclick="number('3')">3</button>
<button
  class="operator"
  data-op="+"
  onclick="operator('+')">+</button>
<button
  class="number zero"
  onclick="number('0')">0</button>
<button
  class="number"
  onclick="decimal()">,</button>
<button
  class="operator"
  onclick="equals()">=</button>
  </div>
</div>
<!-- =========================
     PANEL PRIVADO % %
========================= -->
<div id="privatePanel"
     class="private-panel">
  <div class="private-title">
    Información
  </div>
  <div class="private-label">
    Número que hay que sumar
  </div>
  <div id="privateMissing"
       class="private-number">
    0
  </div>
  <div class="private-label">
    Resultado final
  </div>
  <div id="privateFinal"
       class="private-result">
    0
  </div>

Cerrar
</div>
<script>
/* =====================================================
   ESTADO
===================================================== */
let current = "0";
let previous = null;
let currentOperator = null;
let waitingForOperand = false;
let expressionParts = [];
let accumulatedTotal = null;
/*
  Control del doble =
*/
let lastEqualsTime = 0;
/*
  Control del doble %
*/
let lastPercentTime = 0;
/*
  Estado especial del truco.
  Después del segundo =,
  la calculadora muestra el número
  que falta.
  El total original se guarda aquí.
*/
let trickActive = false;
let trickOriginalTotal = null;
let trickMissing = null;
/* =====================================================
   ELEMENTOS
===================================================== */
const resultEl =
  document.getElementById("result");
const expressionEl =
  document.getElementById("expression");
const historyEl =
  document.getElementById("history");
const privatePanel =
  document.getElementById("privatePanel");
const privateMissing =
  document.getElementById("privateMissing");
const privateFinal =
  document.getElementById("privateFinal");
/* =====================================================
   FORMATO
===================================================== */
function formatNumber(value){
  if(!Number.isFinite(value)){
    return "Error";
  }
  return value.toLocaleString("es-ES",{
    maximumFractionDigits:10,
    useGrouping:true
  });
}
/* =====================================================
   ACTUALIZAR PANTALLA
===================================================== */
function updateDisplay(){
  if(current.includes(".")){
    resultEl.textContent =
      current.replace(".",",");
  }else{
    resultEl.textContent =
      formatNumber(Number(current));
  }
  expressionEl.textContent =
    expressionParts.join(" ");
}
/* =====================================================
   NÚMEROS
===================================================== */
function number(num){
  /*
    Si estamos en el modo del truco
    y el espectador empieza a escribir,
    se cancela el estado especial.
  */
  if(trickActive){
    trickActive=false;
    trickOriginalTotal=null;
    trickMissing=null;
    previous=null;
    currentOperator=null;
    waitingForOperand=false;
    expressionParts=[];
  }
  if(current==="Error"){
    current="0";
  }
  if(waitingForOperand){
    current=num;
    waitingForOperand=false;
  }else{
    if(current==="0"){
      current=num;
    }else{
      current+=num;
    }
  }
  updateDisplay();
}
/* =====================================================
   DECIMAL
===================================================== */
function decimal(){
  if(trickActive){
    trickActive=false;
    trickOriginalTotal=null;
    trickMissing=null;
    previous=null;
    currentOperator=null;
    waitingForOperand=false;
    expressionParts=[];
  }
  if(waitingForOperand){
    current="0.";
    waitingForOperand=false;
  }else if(!current.includes(".")){
    current+=".";
  }
  updateDisplay();
}
/* =====================================================
   OPERADORES
===================================================== */
function operator(op){
  /*
    CASO ESPECIAL DEL TRUCO
    Después del segundo "=":
    La pantalla contiene el número que falta.
    Si el espectador pulsa "+",
    preparamos automáticamente:
    TOTAL ORIGINAL + NÚMERO QUE FALTA
  */
  if(trickActive && op==="+"){
    previous =
      trickOriginalTotal;
    currentOperator="+";
    waitingForOperand=true;
    expressionParts=[
      formatNumber(trickOriginalTotal),
      "+"
    ];
    trickActive=false;
    updateDisplay();
    document
      .querySelectorAll(".operator")
      .forEach(btn=>{
        btn.classList.remove("active");
      });
    const active =
      document.querySelector(
        '.operator[data-op="+"]'
      );
    if(active){
      active.classList.add("active");
    }
    return;
  }
  /*
    Operación normal
  */
  const value =
    Number(current);
  if(currentOperator &&
     waitingForOperand){
    currentOperator=op;
    expressionParts[
      expressionParts.length-1
    ]=operatorSymbol(op);
    updateDisplay();
    return;
  }
  if(previous===null){
    previous=value;
  }else if(currentOperator){
    const calculated =
      calculate(
        previous,
        value,
        currentOperator
      );
    current =
      String(calculated);
    previous =
      calculated;
  }
  currentOperator=op;
  waitingForOperand=true;
  expressionParts.push(
    formatNumber(value)
  );
  expressionParts.push(
    operatorSymbol(op)
  );
  updateDisplay();
  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
  const active =
    document.querySelector(
      `.operator[data-op="${op}"]`
    );
  if(active){
    active.classList.add("active");
  }
}
/* =====================================================
   SÍMBOLOS
===================================================== */
function operatorSymbol(op){
  if(op==="+") return "+";
  if(op==="-") return "−";
  if(op==="*") return "×";
  if(op==="/") return "÷";
  return op;
}
/* =====================================================
   CÁLCULO
===================================================== */
function calculate(a,b,op){
  if(op==="+"){
    return a+b;
  }
  if(op==="-"){
    return a-b;
  }
  if(op==="*"){
    return a*b;
  }
  if(op==="/"){
    return b===0 ? NaN : a/b;
  }
  return b;
}
/* =====================================================
   IGUAL
===================================================== */
function equals(){
  const now =
    Date.now();
  const doubleEquals =
    (now-lastEqualsTime <= 1000);
  lastEqualsTime =
    now;
  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
  /*
    SI ESTAMOS EN EL PASO FINAL
    DEL TRUCO
  */
  if(currentOperator==="+" &&
     previous!==null &&
     !trickActive){
    const operand =
      Number(current);
    const oldPrevious =
      previous;
    const result =
      calculate(
        oldPrevious,
        operand,
        "+"
      );
    historyEl.innerHTML +=
      `<div>
        ${formatNumber(oldPrevious)}
        +
        ${formatNumber(operand)}
        =
        ${formatNumber(result)}
      </div>`;
    current =
      String(result);
    accumulatedTotal =
      result;
    previous=null;
    currentOperator=null;
    waitingForOperand=true;
    expressionParts=[];
    /*
      Mostrar el resultado objetivo
      de forma limpia.
    */
    const target =
      getTarget();
    /*
      Si el resultado coincide con el
      objetivo actual, mostramos la fecha
      y hora en formato legible.
    */
    if(
      Math.trunc(result) ===
      target.number
    ){
      resultEl.textContent =
        target.string;
      expressionEl.textContent =
        target.readable;
    }else{
      updateDisplay();
    }
    return;
  }
  /*
    SEGUNDO "="
    Aquí aparece el número que falta.
  */
  if(doubleEquals){
    mostrarNumeroQueFalta();
    return;
  }
  /*
    PRIMER "=" NORMAL
  */
  if(currentOperator!==null &&
     previous!==null){
    const operand =
      Number(current);
    const oldPrevious =
      previous;
    const oldOperator =
      currentOperator;
    const result =
      calculate(
        oldPrevious,
        operand,
        oldOperator
      );
    historyEl.innerHTML +=
      `<div>
        ${formatNumber(oldPrevious)}
        ${operatorSymbol(oldOperator)}
        ${formatNumber(operand)}
        =
        ${formatNumber(result)}
      </div>`;
    current =
      String(result);
    accumulatedTotal =
      result;
    previous=null;
    currentOperator=null;
    waitingForOperand=true;
    expressionParts=[];
    updateDisplay();
  }else{
    accumulatedTotal =
      Number(current);
    waitingForOperand=true;
    updateDisplay();
  }
}
/* =====================================================
   FECHA Y HORA
===================================================== */
function getTarget(){
  const now =
    new Date();
  const day =
    String(now.getDate())
      .padStart(2,"0");
  const month =
    String(now.getMonth()+1)
      .padStart(2,"0");
  const year =
    String(now.getFullYear());
  const hour =
    String(now.getHours())
      .padStart(2,"0");
  const minute =
    String(now.getMinutes())
      .padStart(2,"0");
  /*
    OBJETIVO:
    DDMMYYYYHHMM
  */
  const targetString =
    day +
    month +
    year +
    hour +
    minute;
  return{
    number:
      Number(targetString),
    string:
      targetString,
    readable:
      `${day}/${month}/${year} ${hour}:${minute}`
  };
}
/* =====================================================
   MOSTRAR NÚMERO QUE FALTA
===================================================== */
function mostrarNumeroQueFalta(){
  /*
    El total que llevaba el espectador
    antes del doble "=".
  */
  let total =
    Number(accumulatedTotal);
  if(!Number.isFinite(total)){
    total =
      Number(current);
  }
  if(!Number.isFinite(total)){
    total=0;
  }
  const target =
    getTarget();
  /*
    Número exacto que falta.
  */
  const missing =
    Math.trunc(
      target.number-total
    );
  /*
    Guardamos todo para el siguiente paso.
  */
  trickOriginalTotal =
    total;
  trickMissing =
    missing;
  trickActive =
    true;
  /*
    La pantalla muestra ÚNICAMENTE
    el número que tienes que decir.
  */
  expressionEl.textContent =
    "";
  resultEl.textContent =
    String(missing);
  /*
    No aparece ningún panel.
  */
  previous=null;
  currentOperator=null;
  waitingForOperand=true;
  expressionParts=[];
}
/* =====================================================
   PORCENTAJE
===================================================== */
function percent(){
  const now =
    Date.now();
  const doublePercent =
    (now-lastPercentTime <= 1000);
  lastPercentTime =
    now;
  /*
    DOBLE %
    Consulta privada.
  */
  if(doublePercent){
    mostrarInformacionPrivada();
    return;
  }
  /*
    % NORMAL
  */
  if(trickActive){
    /*
      Si estamos mirando el número del truco,
      un % normal no debe destruirlo.
    */
    return;
  }
  const value =
    Number(current);
  current =
    String(value/100);
  updateDisplay();
}
/* =====================================================
   PANEL PRIVADO
===================================================== */
function mostrarInformacionPrivada(){
  let total =
    Number(accumulatedTotal);
  if(!Number.isFinite(total)){
    total =
      Number(current);
  }
  if(!Number.isFinite(total)){
    total=0;
  }
  const target =
    getTarget();
  const missing =
    Math.trunc(
      target.number-total
    );
  privateMissing.textContent =
    String(missing);
  privateFinal.textContent =
    target.string;
  privatePanel.style.display =
    "block";
}
function closePrivatePanel(){
  privatePanel.style.display =
    "none";
  lastPercentTime=0;
}
/* =====================================================
   AC
===================================================== */
function clearAll(){
  current="0";
  previous=null;
  currentOperator=null;
  waitingForOperand=false;
  expressionParts=[];
  accumulatedTotal=null;
  lastEqualsTime=0;
  lastPercentTime=0;
  trickActive=false;
  trickOriginalTotal=null;
  trickMissing=null;
  historyEl.innerHTML="";
  expressionEl.textContent="";
  resultEl.textContent="0";
  closePrivatePanel();
  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
}
/* =====================================================
   +/-
===================================================== */
function toggleSign(){
  if(trickActive){
    return;
  }
  if(current==="0"){
    return;
  }
  if(current.startsWith("-")){
    current =
      current.substring(1);
  }else{
    current =
      "-"+current;
  }
  updateDisplay();
}
/* =====================================================
   TECLADO FÍSICO
===================================================== */
document.addEventListener(
  "keydown",
  function(e){
    if(e.key>="0" &&
       e.key<="9"){
      number(e.key);
    }
    if(e.key==="."){
      decimal();
    }
    if(e.key==="+"){
      operator("+");
    }
    if(e.key==="-"){
      operator("-");
    }
    if(e.key==="*"){
      operator("*");
    }
    if(e.key==="/"){
      e.preventDefault();
      operator("/");
    }
    if(e.key==="Enter" ||
       e.key==="="){
      equals();
    }
    if(e.key==="Escape"){
      clearAll();
    }
    if(e.key==="%"){
      percent();
    }
  }
);
/* =====================================================
   INICIO
===================================================== */
updateDisplay();
</script>
</body>
</html>
