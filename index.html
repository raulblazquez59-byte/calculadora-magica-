<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Calculadora</title>
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none
}
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif
}
body{
    min-height:100svh
}
.calculator{
    width:100%;
    height:100dvh;
    min-height:100svh;
    background:#000;
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top) 12px calc(8px + env(safe-area-inset-bottom)) 12px
}
.display{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:0 4px 12px;
    overflow:hidden
}
.history{
    width:100%;
    max-height:24%;
    overflow:hidden;
    text-align:right;
    color:#777;
    font-size:16px;
    line-height:1.3;
    margin-bottom:4px
}
.expression{
    width:100%;
    min-height:24px;
    text-align:right;
    color:#777;
    font-size:20px;
    font-weight:400;
    line-height:1.2;
    white-space:nowrap;
    overflow:hidden;
    margin-bottom:2px
}
.result{
    width:100%;
    text-align:right;
    color:#fff;
    font-size:clamp(46px,14vw,86px);
    font-weight:300;
    line-height:.95;
    letter-spacing:-2px;
    white-space:nowrap;
    overflow:hidden
}
.keypad{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:repeat(5,1fr);
    gap:9px;
    flex:0 0 auto
}
button{
    width:100%;
    aspect-ratio:1/1;
    border:0;
    outline:0;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:inherit;
    font-size:clamp(25px,7vw,35px);
    font-weight:400;
    line-height:1;
    color:#fff;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
    transition:transform .07s ease,filter .07s ease
}
button:active{
    transform:scale(.92)
}
.number{
    background:#333;
    color:#fff
}
.function{
    background:#a5a5a5;
    color:#000
}
.delete{
    background:#a5a5a5;
    color:#000;
    font-size:clamp(22px,6vw,31px)
}
.operator{
    background:#ff9500;
    color:#fff
}
.operator.active{
    background:#fff;
    color:#ff9500
}
.zero{
    grid-column:span 1;
    aspect-ratio:1/1;
    border-radius:50%;
    justify-content:center;
    padding-left:0
}
.notice{
    position:fixed;
    left:50%;
    bottom:calc(100px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    background:#222;
    color:#fff;
    padding:10px 16px;
    border-radius:14px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    z-index:100
}
.notice.show{
    opacity:1
}
@media(max-height:700px){
    .keypad{
        gap:7px
    }
    .display{
        padding-bottom:9px
    }
    button{
        font-size:26px
    }
}
@media(min-height:850px){
    .keypad{
        gap:10px
    }
}
</style>
</head>
<body>
<div class="calculator">
    <div class="display">
        <div id="history" class="history"></div>
        <div id="expression" class="expression"></div>
        <div id="result" class="result">0</div>
    </div>
    <div class="keypad">
        <button class="delete" onclick="deleteLast()" aria-label="Borrar">⌫</button>
        <button class="function" onclick="clearAll()">AC</button>
        <button class="function" onclick="percent()">%</button>
        <button class="operator" data-op="/" onclick="operator('/')">÷</button>
        <button class="number" onclick="number('7')">7</button>
        <button class="number" onclick="number('8')">8</button>
        <button class="number" onclick="number('9')">9</button>
        <button class="operator" data-op="*" onclick="operator('*')">×</button>
        <button class="number" onclick="number('4')">4</button>
        <button class="number" onclick="number('5')">5</button>
        <button class="number" onclick="number('6')">6</button>
        <button class="operator" data-op="-" onclick="operator('-')">−</button>
        <button class="number" onclick="number('1')">1</button>
        <button class="number" onclick="number('2')">2</button>
        <button class="number" onclick="number('3')">3</button>
        <button class="operator" data-op="+" onclick="operator('+')">+</button>
        <button class="function" onclick="toggleSign()">±</button>
        <button class="number zero" onclick="number('0')">0</button>
        <button class="number" onclick="decimal()">,</button>
        <button class="operator" onclick="equals()">=</button>
    </div>
</div>
<div id="notice" class="notice"></div>
<script>
let current="0";
let previous=null;
let currentOperator=null;
let waitingForOperand=false;
let expressionParts=[];
let accumulatedTotal=null;
/*
 * MODO TRUCO
 */
let magicMode=false;
let magicBase=null;
let magicMissing=null;
let magicTarget=null;
let magicTargetString=null;
/*
 * Control de los "="
 */
let equalsStage=0;
/*
 * Referencia visual a la última operación
 */
let magicHistoryEntry=null;
/*
 * NUEVO:
 *
 * Guarda el total que existía ANTES
 * de la última operación.
 *
 * Este es el número que utiliza el truco.
 *
 * El resultado de la última operación
 * NO se utiliza.
 */
let magicBaseBeforeLastOperation=null;
const resultEl=document.getElementById("result");
const expressionEl=document.getElementById("expression");
const historyEl=document.getElementById("history");
const notice=document.getElementById("notice");
function formatNumber(value){
    if(!Number.isFinite(value)) return "Error";
    return value.toLocaleString("es-ES",{
        maximumFractionDigits:10,
        useGrouping:true
    });
}
function addHistory(text){
    const entry=document.createElement("div");
    entry.textContent=text;
    historyEl.appendChild(entry);
    return entry;
}
function updateDisplay(){
    if(current==="Error"){
        resultEl.textContent="Error";
    }else if(current.includes(".")){
        /*
         * Mantiene siempre la coma decimal
         */
        resultEl.textContent=current.replace(".",",");
    }else{
        resultEl.textContent=formatNumber(Number(current));
    }
    expressionEl.textContent=expressionParts.join(" ");
}
function resetMagic(){
    magicMode=false;
    magicBase=null;
    magicMissing=null;
    magicTarget=null;
    magicTargetString=null;
    magicHistoryEntry=null;
}
function number(num){
    equalsStage=0;
    if(magicMode){
        resetMagic();
    }
    if(current==="Error"){
        current="0";
    }
    if(waitingForOperand){
        current=num;
        waitingForOperand=false;
    }else{
        if(current==="0"){
            current=num;
        }else{
            current+=num;
        }
    }
    updateDisplay();
}
function decimal(){
    equalsStage=0;
    if(magicMode){
        resetMagic();
        current="0";
        waitingForOperand=false;
        expressionParts=[];
    }
    if(waitingForOperand){
        current="0.";
        waitingForOperand=false;
    }else if(!current.includes(".")){
        current+=".";
    }
    updateDisplay();
}
function deleteLast(){
    if(magicMode){
        resetMagic();
        equalsStage=0;
    }
    if(waitingForOperand || current==="Error") return;
    if(current.length<=1){
        current="0";
    }else{
        current=current.slice(0,-1);
    }
    updateDisplay();
}
function operator(op){
    equalsStage=0;
    if(magicMode){
        resetMagic();
    }
    const value=Number(current);
    if(currentOperator && waitingForOperand){
        currentOperator=op;
        expressionParts[expressionParts.length-1]=operatorSymbol(op);
        updateDisplay();
        return;
    }
    if(previous===null){
        previous=value;
    }else if(currentOperator){
        const calculated=calculate(
            previous,
            value,
            currentOperator
        );
        current=String(calculated);
        previous=calculated;
    }
    currentOperator=op;
    waitingForOperand=true;
    expressionParts.push(formatNumber(value));
    expressionParts.push(operatorSymbol(op));
    updateDisplay();
    document.querySelectorAll(".operator").forEach(btn=>{
        btn.classList.remove("active");
    });
    const active=document.querySelector(
        `.operator[data-op="${op}"]`
    );
    if(active){
        active.classList.add("active");
    }
}
function operatorSymbol(op){
    if(op==="+") return "+";
    if(op==="-") return "−";
    if(op==="*") return "×";
    if(op==="/") return "÷";
    return op;
}
function calculate(a,b,op){
    if(op==="+") return a+b;
    if(op==="-") return a-b;
    if(op==="*") return a*b;
    if(op==="/") return b===0 ? NaN : a/b;
    return b;
}
/*
 * "="
 */
function equals(){
    /*
     * TERCER "="
     *
     * Completa el truco y muestra
     * la fecha/hora final.
     */
    if(magicMode){
        const finalResult=magicBase+magicMissing;
        current=magicTargetString;
        previous=null;
        currentOperator=null;
        waitingForOperand=true;
        expressionParts=[];
        expressionEl.textContent="";
        resultEl.textContent=magicTargetString;
        accumulatedTotal=finalResult;
        resetMagic();
        equalsStage=0;
        document.querySelectorAll(".operator").forEach(btn=>{
            btn.classList.remove("active");
        });
        return;
    }
    /*
     * PRIMER "="
     *
     * Realiza la última operación.
     */
    if(equalsStage===0){
        document.querySelectorAll(".operator").forEach(btn=>{
            btn.classList.remove("active");
        });
        if(currentOperator!==null && previous!==null){
            const operand=Number(current);
            const oldPrevious=previous;
            /*
             * AQUÍ ESTÁ LA CORRECCIÓN IMPORTANTE
             *
             * Guardamos el total ANTERIOR
             * a esta última operación.
             *
             * Este valor será el utilizado
             * posteriormente por el truco.
             */
            magicBaseBeforeLastOperation=accumulatedTotal;
            /*
             * Si no existe un total anterior,
             * utilizamos el primer número.
             */
            if(!Number.isFinite(magicBaseBeforeLastOperation)){
                magicBaseBeforeLastOperation=oldPrevious;
            }
            const result=calculate(
                oldPrevious,
                operand,
                currentOperator
            );
            /*
             * Guardamos la operación completa
             * para modificar solamente su resultado
             * cuando se pulse el segundo "=".
             */
            magicHistoryEntry=addHistory(
                `${formatNumber(oldPrevious)} ${operatorSymbol(currentOperator)} ${formatNumber(operand)} = ${formatNumber(result)}`
            );
            /*
             * Este resultado se muestra normalmente.
             *
             * Pero NO será utilizado por el truco.
             */
            current=String(result);
            accumulatedTotal=result;
            previous=null;
            currentOperator=null;
            waitingForOperand=true;
            expressionParts=[];
            updateDisplay();
        }else{
            accumulatedTotal=Number(current);
            updateDisplay();
        }
        equalsStage=1;
        return;
    }
    /*
     * SEGUNDO "="
     *
     * Ejecuta el truco.
     */
    if(equalsStage===1){
        ejecutarTruco();
        equalsStage=2;
        return;
    }
}
/*
 * FECHA Y HORA OBJETIVO
 */
function getTarget(){
    const now=new Date();
    const day=String(
        now.getDate()
    ).padStart(2,"0");
    const month=String(
        now.getMonth()+1
    ).padStart(2,"0");
    const year=String(
        now.getFullYear()
    );
    const hour=String(
        now.getHours()
    ).padStart(2,"0");
    const minute=String(
        now.getMinutes()
    ).padStart(2,"0");
    const targetString=
        day+
        month+
        year+
        hour+
        minute;
    return{
        number:Number(targetString),
        string:targetString,
        readable:
            `${day}/${month}/${year} ${hour}:${minute}`
    };
}
/*
 * TRUCO
 */
function ejecutarTruco(){
    /*
     * IMPORTANTE:
     *
     * NO utilizamos accumulatedTotal.
     *
     * accumulatedTotal contiene el resultado
     * de la última operación.
     *
     * Utilizamos exclusivamente
     * magicBaseBeforeLastOperation.
     */
    let currentTotal=
        Number(magicBaseBeforeLastOperation);
    /*
     * Si no existe una operación anterior,
     * el total anterior será 0.
     */
    if(!Number.isFinite(currentTotal)){
        currentTotal=0;
    }
    const target=getTarget();
    const targetNumber=target.number;
    /*
     * Este es el número secreto.
     *
     * Última operación NO incluida.
     */
    const missing=
        targetNumber-currentTotal;
    if(missing<0){
        showNotice(
            "El resultado actual es demasiado alto."
        );
        return;
    }
    magicMode=true;
    magicBase=currentTotal;
    magicMissing=missing;
    magicTarget=targetNumber;
    magicTargetString=target.string;
    /*
     * SOLO modificamos el resultado
     * de la última operación.
     *
     * Las operaciones anteriores
     * permanecen intactas.
     */
    if(magicHistoryEntry){
        magicHistoryEntry.textContent=
            magicHistoryEntry.textContent.replace(
                / = .*$/,
                ` = ${String(missing)}`
            );
    }
    current=String(missing);
    previous=null;
    currentOperator=null;
    waitingForOperand=true;
    expressionParts=[];
    expressionEl.textContent="";
    resultEl.textContent=String(missing);
}
/*
 * AC
 */
function clearAll(){
    current="0";
    previous=null;
    currentOperator=null;
    waitingForOperand=false;
    expressionParts=[];
    accumulatedTotal=null;
    resetMagic();
    equalsStage=0;
    /*
     * También reiniciamos
     * el total anterior.
     */
    magicBaseBeforeLastOperation=null;
    /*
     * AC borra el historial.
     */
    historyEl.innerHTML="";
    expressionEl.textContent="";
    resultEl.textContent="0";
    document.querySelectorAll(".operator").forEach(btn=>{
        btn.classList.remove("active");
    });
}
/*
 * SIGNO
 */
function toggleSign(){
    equalsStage=0;
    if(current==="0") return;
    if(current.startsWith("-")){
        current=current.substring(1);
    }else{
        current="-"+current;
    }
    updateDisplay();
}
/*
 * PORCENTAJE
 */
function percent(){
    equalsStage=0;
    const value=Number(current);
    current=String(value/100);
    updateDisplay();
}
/*
 * AVISO
 */
function showNotice(text){
    notice.textContent=text;
    notice.classList.add("show");
    setTimeout(()=>{
        notice.classList.remove("show");
    },2500);
}
/*
 * TECLADO FÍSICO
 */
document.addEventListener("keydown",function(e){
    if(e.key>="0" && e.key<="9"){
        number(e.key);
    }
    if(e.key==="." || e.key===","){
        decimal();
    }
    if(e.key==="+"){
        operator("+");
    }
    if(e.key==="-"){
        operator("-");
    }
    if(e.key==="*"){
        operator("*");
    }
    if(e.key==="/"){
        e.preventDefault();
        operator("/");
    }
    if(e.key==="Enter" || e.key==="="){
        equals();
    }
    if(e.key==="Escape"){
        clearAll();
    }
    if(e.key==="%"){
        percent();
    }
    if(e.key==="Backspace"){
        deleteLast();
    }
});
updateDisplay();
</script>
</body>
</html>

La diferencia importante: si las operaciones anteriores suman, por ejemplo, 1500, y la última operación da 700, el truco calcula la cifra secreta desde 1500, no desde 2200. El 700 solo se muestra como la operación que hizo el espectador y no participa en el cálculo.
