<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      minimum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Calculadora</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{
  min-height:100svh;
}

/* =========================
   CALCULADORA
========================= */

.calculator{
  width:100%;
  height:100dvh;
  min-height:100svh;

  display:flex;
  flex-direction:column;

  padding:
    0
    12px
    calc(8px + env(safe-area-inset-bottom))
    12px;

  background:#000;
}

/* =========================
   PANTALLA
========================= */

.display{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;

  padding:
    10px
    6px
    14px;

  overflow:hidden;
}

.history{
  width:100%;

  max-height:30%;

  overflow:hidden;

  text-align:right;

  color:#777;

  font-size:17px;
  line-height:1.35;

  margin-bottom:5px;
}

.expression{
  width:100%;

  min-height:25px;

  text-align:right;

  color:#888;

  font-size:21px;
  line-height:1.2;

  white-space:nowrap;

  overflow:hidden;

  margin-bottom:3px;
}

.result{
  width:100%;

  text-align:right;

  color:#fff;

  font-size:clamp(
    44px,
    14vw,
    86px
  );

  font-weight:300;

  line-height:.95;

  letter-spacing:-1px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:clip;
}

/* =========================
   TECLADO
========================= */

.keypad{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(4, minmax(0,1fr));

  gap:9px;

  flex:0 0 auto;

  align-items:stretch;
}

button{
  width:100%;

  min-width:0;

  aspect-ratio:1 / 1;

  border:0;

  border-radius:50%;

  font-family:inherit;

  font-size:clamp(
    25px,
    7vw,
    36px
  );

  font-weight:400;

  cursor:pointer;

  touch-action:manipulation;

  padding:0;

  transition:
    transform .08s ease,
    filter .08s ease;
}

button:active{
  transform:scale(.92);
}

/* Números */

.number{
  background:#333;
  color:#fff;
}

/* Funciones */

.function{
  background:#a5a5a5;
  color:#000;
}

/* Operadores */

.operator{
  background:#ff9500;
  color:#fff;
}

.operator.active{
  background:#fff;
  color:#ff9500;
}

/* Cero */

.zero{
  grid-column:span 2;

  aspect-ratio:auto;

  border-radius:50px;

  text-align:left;

  padding-left:28px;
}

/* =========================
   AVISO
========================= */

.notice{
  position:fixed;

  left:50%;

  bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  background:#222;

  padding:11px 17px;

  border-radius:15px;

  font-size:14px;

  color:#fff;

  opacity:0;

  pointer-events:none;

  transition:opacity .2s;

  z-index:50;

  text-align:center;

  width:max-content;

  max-width:90%;
}

.notice.show{
  opacity:1;
}
</style>
</head>

<body>

<div class="calculator">

  <div class="display">

    <div
      id="history"
      class="history">
    </div>

    <div
      id="expression"
      class="expression">
    </div>

    <div
      id="result"
      class="result">
      0
    </div>

  </div>

  <div class="keypad">

    <button
      class="function"
      onclick="clearAll()">
      AC
    </button>

    <button
      class="function"
      onclick="toggleSign()">
      ±
    </button>

    <button
      class="function"
      onclick="percent()">
      %
    </button>

    <button
      class="operator"
      data-op="/"
      onclick="operator('/')">
      ÷
    </button>


    <button
      class="number"
      onclick="number('7')">
      7
    </button>

    <button
      class="number"
      onclick="number('8')">
      8
    </button>

    <button
      class="number"
      onclick="number('9')">
      9
    </button>

    <button
      class="operator"
      data-op="*"
      onclick="operator('*')">
      ×
    </button>


    <button
      class="number"
      onclick="number('4')">
      4
    </button>

    <button
      class="number"
      onclick="number('5')">
      5
    </button>

    <button
      class="number"
      onclick="number('6')">
      6
    </button>

    <button
      class="operator"
      data-op="-"
      onclick="operator('-')">
      −
    </button>


    <button
      class="number"
      onclick="number('1')">
      1
    </button>

    <button
      class="number"
      onclick="number('2')">
      2
    </button>

    <button
      class="number"
      onclick="number('3')">
      3
    </button>

    <button
      class="operator"
      data-op="+"
      onclick="operator('+')">
      +
    </button>


    <button
      class="number zero"
      onclick="number('0')">
      0
    </button>

    <button
      class="number"
      onclick="decimal()">
      ,
    </button>

    <button
      class="operator"
      onclick="equals()">
      =
    </button>

  </div>

</div>

<div
  id="notice"
  class="notice">
</div>


<script>

/* =====================================================
   ESTADO NORMAL
===================================================== */

let current = "0";

let previous = null;

let currentOperator = null;

let waitingForOperand = false;

let expressionParts = [];


/* =====================================================
   ESTADO DEL TRUCO
===================================================== */

let accumulatedTotal = null;

let magicMode = false;

let magicBase = null;

let magicMissing = null;

let magicTarget = null;

let magicTargetString = null;


/*
   0 = no se ha pulsado =
   1 = ya se ha pulsado el primer =
   2 = el doble = ya activó el truco
*/

let equalsStage = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const resultEl =
  document.getElementById("result");

const expressionEl =
  document.getElementById("expression");

const historyEl =
  document.getElementById("history");

const notice =
  document.getElementById("notice");


/* =====================================================
   FORMATO NORMAL
===================================================== */

function formatNumber(value){

  if(!Number.isFinite(value)){
    return "Error";
  }

  return value.toLocaleString(
    "es-ES",
    {
      maximumFractionDigits:10,
      useGrouping:true
    }
  );
}


/* =====================================================
   ACTUALIZAR PANTALLA
===================================================== */

function updateDisplay(){

  if(current === "Error"){

    resultEl.textContent = "Error";

  }else if(current.includes(".")){

    resultEl.textContent =
      current.replace(".",",");

  }else{

    resultEl.textContent =
      formatNumber(Number(current));
  }

  expressionEl.textContent =
    expressionParts.join(" ");
}


/* =====================================================
   NÚMEROS
===================================================== */

function number(num){

  /*
   * Cualquier número nuevo cancela
   * la secuencia del doble igual.
   */

  equalsStage = 0;


  /*
   * Si estábamos mostrando
   * el número secreto, empezar
   * a escribir significa abandonar
   * el modo mágico.
   */

  if(magicMode){

    magicMode = false;

    magicBase = null;

    magicMissing = null;

    magicTarget = null;

    magicTargetString = null;
  }


  if(current === "Error"){

    current = "0";
  }


  if(waitingForOperand){

    current = num;

    waitingForOperand = false;

  }else{

    if(current === "0"){

      current = num;

    }else{

      current += num;
    }
  }


  updateDisplay();
}


/* =====================================================
   DECIMAL
===================================================== */

function decimal(){

  equalsStage = 0;


  if(magicMode){

    magicMode = false;

    magicBase = null;

    magicMissing = null;

    magicTarget = null;

    magicTargetString = null;

    current = "0";

    waitingForOperand = false;

    expressionParts = [];
  }


  if(waitingForOperand){

    current = "0.";

    waitingForOperand = false;

  }else if(!current.includes(".")){

    current += ".";
  }


  updateDisplay();
}


/* =====================================================
   OPERADORES
===================================================== */

function operator(op){

  /*
   * Una operación nueva cancela
   * la secuencia del doble igual.
   */

  equalsStage = 0;


  if(magicMode){

    magicMode = false;

    magicBase = null;

    magicMissing = null;

    magicTarget = null;

    magicTargetString = null;
  }


  const value =
    Number(current);


  if(
    currentOperator &&
    waitingForOperand
  ){

    currentOperator = op;

    expressionParts[
      expressionParts.length - 1
    ] = operatorSymbol(op);

    updateDisplay();

    return;
  }


  if(previous === null){

    previous = value;

  }else if(currentOperator){

    const calculated =
      calculate(
        previous,
        value,
        currentOperator
      );

    current =
      String(calculated);

    previous =
      calculated;
  }


  currentOperator = op;

  waitingForOperand = true;


  expressionParts.push(
    formatNumber(value)
  );

  expressionParts.push(
    operatorSymbol(op)
  );


  updateDisplay();


  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  const active =
    document.querySelector(
      `.operator[data-op="${op}"]`
    );


  if(active){

    active.classList.add("active");
  }
}


/* =====================================================
   SÍMBOLOS
===================================================== */

function operatorSymbol(op){

  if(op === "+") return "+";

  if(op === "-") return "−";

  if(op === "*") return "×";

  if(op === "/") return "÷";

  return op;
}


/* =====================================================
   CÁLCULO
===================================================== */

function calculate(a,b,op){

  if(op === "+")
    return a + b;

  if(op === "-")
    return a - b;

  if(op === "*")
    return a * b;

  if(op === "/")
    return b === 0
      ? NaN
      : a / b;

  return b;
}


/* =====================================================
   IGUAL
===================================================== */

function equals(){

  /*
   * =========================================
   * TERCER =
   *
   * Estamos en modo mágico.
   * El número mostrado es el que falta.
   *
   * Al pulsar =:
   *
   * TOTAL + FALTANTE
   *
   * = FECHA/HORA
   * =========================================
   */

  if(magicMode){

    const finalResult =
      magicBase + magicMissing;


    /*
     * Mostramos el objetivo congelado.
     */

    current =
      magicTargetString;


    previous = null;

    currentOperator = null;

    waitingForOperand = true;

    expressionParts = [];


    expressionEl.textContent = "";

    resultEl.textContent =
      magicTargetString;


    /*
     * Guardamos la operación
     * en historial, igual que una
     * calculadora normal.
     */

    historyEl.innerHTML +=
      `<div>
        ${formatNumber(magicBase)}
        +
        ${String(magicMissing)}
        =
        ${magicTargetString}
      </div>`;


    /*
     * Finalizamos el modo secreto.
     */

    accumulatedTotal =
      finalResult;

    magicMode = false;

    magicBase = null;

    magicMissing = null;

    magicTarget = null;

    magicTargetString = null;

    equalsStage = 0;


    document
      .querySelectorAll(".operator")
      .forEach(btn=>{
        btn.classList.remove("active");
      });


    return;
  }


  /*
   * =========================================
   * PRIMER =
   * =========================================
   */

  if(equalsStage === 0){

    document
      .querySelectorAll(".operator")
      .forEach(btn=>{
        btn.classList.remove("active");
      });


    /*
     * Si existe una operación pendiente,
     * la calculamos normalmente.
     */

    if(
      currentOperator !== null &&
      previous !== null
    ){

      const operand =
        Number(current);

      const oldPrevious =
        previous;

      const result =
        calculate(
          oldPrevious,
          operand,
          currentOperator
        );


      historyEl.innerHTML +=
        `<div>
          ${formatNumber(oldPrevious)}
          ${operatorSymbol(currentOperator)}
          ${formatNumber(operand)}
          =
          ${formatNumber(result)}
        </div>`;


      current =
        String(result);


      accumulatedTotal =
        result;


      previous = null;

      currentOperator = null;

      waitingForOperand = true;

      expressionParts = [];


      updateDisplay();

    }else{

      /*
       * Si no hay operación,
       * simplemente guardamos el número.
       */

      accumulatedTotal =
        Number(current);

      updateDisplay();
    }


    /*
     * Ya se hizo el primer igual.
     */

    equalsStage = 1;

    return;
  }


  /*
   * =========================================
   * SEGUNDO =
   *
   * AQUÍ SE ACTIVA EL TRUCO.
   * =========================================
   */

  if(equalsStage === 1){

    ejecutarTruco();

    equalsStage = 2;

    return;
  }
}


/* =====================================================
   FECHA Y HORA
===================================================== */

function getTarget(){

  const now =
    new Date();


  const day =
    String(
      now.getDate()
    ).padStart(2,"0");


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");


  const year =
    String(
      now.getFullYear()
    );


  const hour =
    String(
      now.getHours()
    ).padStart(2,"0");


  const minute =
    String(
      now.getMinutes()
    ).padStart(2,"0");


  /*
   * DDMMYYYYHHMM
   *
   * Ejemplo:
   *
   * 270920260215
   */

  const targetString =
    day +
    month +
    year +
    hour +
    minute;


  return {

    number:
      Number(targetString),

    string:
      targetString,

    readable:
      `${day}/${month}/${year} ${hour}:${minute}`
  };
}


/* =====================================================
   ACTIVAR TRUCO
===================================================== */

function ejecutarTruco(){

  let currentTotal =
    Number(accumulatedTotal);


  if(!Number.isFinite(currentTotal)){

    currentTotal =
      Number(current);
  }


  if(!Number.isFinite(currentTotal)){

    return;
  }


  /*
   * Capturamos fecha y hora
   * exactamente en este momento.
   */

  const target =
    getTarget();


  const targetNumber =
    target.number;


  /*
   * CALCULAMOS:
   *
   * OBJETIVO - TOTAL ACTUAL
   */

  const missing =
    targetNumber - currentTotal;


  /*
   * Si el número actual ya es superior
   * al objetivo, no se puede hacer
   * mediante una suma positiva.
   */

  if(missing < 0){

    showNotice(
      "El resultado actual es demasiado alto."
    );

    return;
  }


  /*
   * Guardamos los datos secretos.
   */

  magicMode = true;

  magicBase =
    currentTotal;

  magicMissing =
    missing;

  magicTarget =
    targetNumber;

  magicTargetString =
    target.string;


  /*
   * =========================================
   * AQUÍ ESTÁ EL CAMBIO IMPORTANTE
   *
   * Desaparece el número anterior.
   *
   * Aparece SOLO el número que falta.
   *
   * SIN PUNTOS.
   * SIN COMAS.
   * =========================================
   */

  current =
    String(missing);


  previous = null;

  currentOperator = null;

  waitingForOperand = true;

  expressionParts = [];


  expressionEl.textContent = "";

  resultEl.textContent =
    String(missing);
}


/* =====================================================
   AC
===================================================== */

function clearAll(){

  current = "0";

  previous = null;

  currentOperator = null;

  waitingForOperand = false;

  expressionParts = [];

  accumulatedTotal = null;


  /*
   * Borrar completamente
   * el estado secreto.
   */

  magicMode = false;

  magicBase = null;

  magicMissing = null;

  magicTarget = null;

  magicTargetString = null;


  equalsStage = 0;


  historyEl.innerHTML = "";

  expressionEl.textContent = "";

  resultEl.textContent = "0";


  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
}


/* =====================================================
   +/-
===================================================== */

function toggleSign(){

  equalsStage = 0;


  if(current === "0")
    return;


  if(current.startsWith("-")){

    current =
      current.substring(1);

  }else{

    current =
      "-" + current;
  }


  updateDisplay();
}


/* =====================================================
   %
===================================================== */

function percent(){

  equalsStage = 0;


  const value =
    Number(current);


  current =
    String(value / 100);


  updateDisplay();
}


/* =====================================================
   AVISO
===================================================== */

function showNotice(text){

  notice.textContent =
    text;

  notice.classList.add("show");


  setTimeout(()=>{
    notice.classList.remove("show");
  },2500);
}


/* =====================================================
   TECLADO FÍSICO
===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key >= "0" &&
      e.key <= "9"
    ){

      number(e.key);
    }


    if(e.key === "."){

      decimal();
    }


    if(e.key === "+"){

      operator("+");
    }


    if(e.key === "-"){

      operator("-");
    }


    if(e.key === "*"){

      operator("*");
    }


    if(e.key === "/"){

      e.preventDefault();

      operator("/");
    }


    if(
      e.key === "Enter" ||
      e.key === "="
    ){

      equals();
    }


    if(e.key === "Escape"){

      clearAll();
    }


    if(e.key === "%"){

      percent();
    }
  }
);


/* =====================================================
   INICIO
===================================================== */

updateDisplay();

</script>

</body>
</html>
