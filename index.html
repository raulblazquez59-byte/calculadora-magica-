<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      minimum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Calculadora</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{
  min-height:100svh;
}

/* =========================
   CALCULADORA
========================= */

.calculator{
  width:100%;
  height:100dvh;
  min-height:100svh;

  display:flex;
  flex-direction:column;

  padding:
    0
    12px
    calc(8px + env(safe-area-inset-bottom))
    12px;

  background:#000;
}

/* =========================
   PANTALLA
========================= */

.display{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;

  padding:
    10px
    6px
    14px;

  overflow:hidden;
}

.history{
  width:100%;

  max-height:30%;

  overflow:hidden;

  text-align:right;

  color:#777;

  font-size:17px;
  line-height:1.35;

  margin-bottom:5px;
}

.expression{
  width:100%;

  min-height:25px;

  text-align:right;

  color:#888;

  font-size:21px;
  line-height:1.2;

  white-space:nowrap;

  overflow:hidden;

  margin-bottom:3px;
}

.result{
  width:100%;

  text-align:right;

  color:#fff;

  font-size:clamp(
    44px,
    14vw,
    86px
  );

  font-weight:300;

  line-height:.95;

  letter-spacing:-1px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:clip;
}

/* =========================
   TECLADO
========================= */

.keypad{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(4, minmax(0,1fr));

  gap:9px;

  flex:0 0 auto;

  align-items:stretch;
}

button{
  width:100%;

  min-width:0;

  aspect-ratio:1 / 1;

  border:0;

  border-radius:50%;

  font-family:inherit;

  font-size:clamp(
    25px,
    7vw,
    36px
  );

  font-weight:400;

  cursor:pointer;

  touch-action:manipulation;

  padding:0;

  transition:
    transform .08s ease,
    filter .08s ease;
}

button:active{
  transform:scale(.92);
}

/* Números */

.number{
  background:#333;
  color:#fff;
}

/* Botones superiores */

.function{
  background:#a5a5a5;
  color:#000;
}

/* Operadores */

.operator{
  background:#ff9500;
  color:#fff;
}

.operator.active{
  background:#fff;
  color:#ff9500;
}

/* Cero */

.zero{
  grid-column:span 2;

  aspect-ratio:auto;

  border-radius:50px;

  text-align:left;

  padding-left:28px;
}

/* =========================
   AVISO DISCRETO
   Solo para errores reales.
========================= */

.notice{
  position:fixed;

  left:50%;

  bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  background:#222;

  padding:11px 17px;

  border-radius:15px;

  font-size:14px;

  color:#fff;

  opacity:0;

  pointer-events:none;

  transition:opacity .2s;

  z-index:50;

  text-align:center;

  width:max-content;

  max-width:90%;
}

.notice.show{
  opacity:1;
}
</style>
</head>

<body>

<div class="calculator">

  <div class="display">

    <div
      id="history"
      class="history">
    </div>

    <div
      id="expression"
      class="expression">
    </div>

    <div
      id="result"
      class="result">
      0
    </div>

  </div>

  <div class="keypad">

    <button
      class="function"
      onclick="clearAll()">
      AC
    </button>

    <button
      class="function"
      onclick="toggleSign()">
      ±
    </button>

    <button
      class="function"
      onclick="percent()">
      %
    </button>

    <button
      class="operator"
      data-op="/"
      onclick="operator('/')">
      ÷
    </button>


    <button
      class="number"
      onclick="number('7')">
      7
    </button>

    <button
      class="number"
      onclick="number('8')">
      8
    </button>

    <button
      class="number"
      onclick="number('9')">
      9
    </button>

    <button
      class="operator"
      data-op="*"
      onclick="operator('*')">
      ×
    </button>


    <button
      class="number"
      onclick="number('4')">
      4
    </button>

    <button
      class="number"
      onclick="number('5')">
      5
    </button>

    <button
      class="number"
      onclick="number('6')">
      6
    </button>

    <button
      class="operator"
      data-op="-"
      onclick="operator('-')">
      −
    </button>


    <button
      class="number"
      onclick="number('1')">
      1
    </button>

    <button
      class="number"
      onclick="number('2')">
      2
    </button>

    <button
      class="number"
      onclick="number('3')">
      3
    </button>

    <button
      class="operator"
      data-op="+"
      onclick="operator('+')">
      +
    </button>


    <button
      class="number zero"
      onclick="number('0')">
      0
    </button>

    <button
      class="number"
      onclick="decimal()">
      ,
    </button>

    <button
      class="operator"
      onclick="equals()">
      =
    </button>

  </div>

</div>

<div
  id="notice"
  class="notice">
</div>


<script>

/* =====================================================
   ESTADO
===================================================== */

let current = "0";

let previous = null;

let currentOperator = null;

let waitingForOperand = false;

let expressionParts = [];


/*
   ESTADO DEL TRUCO
*/

let accumulatedTotal = null;

let magicMode = false;

let magicBase = null;

let magicMissing = null;

let magicTarget = null;

let magicTargetString = null;


/*
   CONTROL DEL DOBLE =
*/

let lastEqualsTime = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const resultEl =
  document.getElementById("result");

const expressionEl =
  document.getElementById("expression");

const historyEl =
  document.getElementById("history");

const notice =
  document.getElementById("notice");


/* =====================================================
   FORMATO
===================================================== */

function formatNumber(value){

  if(!Number.isFinite(value)){
    return "Error";
  }

  return value.toLocaleString(
    "es-ES",
    {
      maximumFractionDigits:10,
      useGrouping:true
    }
  );
}


/* =====================================================
   PANTALLA
===================================================== */

function updateDisplay(){

  if(current === "Error"){

    resultEl.textContent = "Error";

  }else if(current.includes(".")){

    resultEl.textContent =
      current.replace(".",",");

  }else{

    resultEl.textContent =
      formatNumber(
        Number(current)
      );
  }

  expressionEl.textContent =
    expressionParts.join(" ");
}


/* =====================================================
   NÚMEROS
===================================================== */

function number(num){

  if(magicMode){

    /*
      Si estamos en modo mágico,
      los números empiezan una nueva entrada.
    */

    magicMode = false;

    magicBase = null;

    magicMissing = null;

    magicTarget = null;

    magicTargetString = null;

    expressionParts = [];

    current = "0";

    waitingForOperand = false;
  }


  if(current === "Error"){

    current = "0";
  }


  if(waitingForOperand){

    current = num;

    waitingForOperand = false;

  }else{

    if(current === "0"){

      current = num;

    }else{

      current += num;
    }
  }


  updateDisplay();
}


/* =====================================================
   DECIMAL
===================================================== */

function decimal(){

  if(magicMode){

    magicMode = false;

    magicBase = null;

    magicMissing = null;

    magicTarget = null;

    magicTargetString = null;

    expressionParts = [];

    current = "0";

    waitingForOperand = false;
  }


  if(waitingForOperand){

    current = "0.";

    waitingForOperand = false;

  }else if(!current.includes(".")){

    current += ".";
  }


  updateDisplay();
}


/* =====================================================
   OPERADORES
===================================================== */

function operator(op){

  /*
    Si estamos en modo mágico,
    cualquier operación nueva cancela
    el estado secreto.
  */

  if(magicMode){

    magicMode = false;

    magicBase = null;

    magicMissing = null;

    magicTarget = null;

    magicTargetString = null;
  }


  const value =
    Number(current);


  if(
    currentOperator &&
    waitingForOperand
  ){

    currentOperator = op;

    expressionParts[
      expressionParts.length - 1
    ] = operatorSymbol(op);

    updateDisplay();

    return;
  }


  if(previous === null){

    previous = value;

  }else if(currentOperator){

    const calculated =
      calculate(
        previous,
        value,
        currentOperator
      );

    current =
      String(calculated);

    previous =
      calculated;
  }


  currentOperator = op;

  waitingForOperand = true;


  expressionParts.push(
    formatNumber(value)
  );

  expressionParts.push(
    operatorSymbol(op)
  );


  updateDisplay();


  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  const active =
    document.querySelector(
      `.operator[data-op="${op}"]`
    );


  if(active){

    active.classList.add("active");
  }
}


/* =====================================================
   SÍMBOLOS
===================================================== */

function operatorSymbol(op){

  if(op === "+") return "+";

  if(op === "-") return "−";

  if(op === "*") return "×";

  if(op === "/") return "÷";

  return op;
}


/* =====================================================
   CÁLCULO
===================================================== */

function calculate(a,b,op){

  if(op === "+")
    return a + b;

  if(op === "-")
    return a - b;

  if(op === "*")
    return a * b;

  if(op === "/")
    return b === 0
      ? NaN
      : a / b;

  return b;
}


/* =====================================================
   IGUAL
===================================================== */

function equals(){

  const now =
    Date.now();


  /*
    ==========================================
    MODO MÁGICO
    ==========================================
  */

  if(magicMode){

    /*
      El número mostrado es el número
      que falta.

      Lo sumamos automáticamente
      al número original.
    */

    const finalResult =
      magicBase +
      magicMissing;


    /*
      Mostramos EXACTAMENTE
      la fecha/hora que congelamos
      cuando se activó el truco.
    */

    current =
      magicTargetString;


    expressionParts = [];


    expressionEl.textContent =
      "";


    resultEl.textContent =
      magicTargetString;


    historyEl.innerHTML +=
      `<div>
        ${formatNumber(magicBase)}
        +
        ${formatNumber(magicMissing)}
        =
        ${magicTargetString}
      </div>`;


    /*
      Salimos del modo mágico.
    */

    magicMode = false;

    magicBase = null;

    magicMissing = null;

    magicTarget = null;

    magicTargetString = null;

    accumulatedTotal =
      Number(finalResult);

    previous = null;

    currentOperator = null;

    waitingForOperand = true;

    lastEqualsTime = 0;


    document
      .querySelectorAll(".operator")
      .forEach(btn=>{
        btn.classList.remove("active");
      });


    return;
  }


  /*
    ==========================================
    DOBLE =
    ==========================================
  */

  const doubleEquals =
    now - lastEqualsTime < 700;


  /*
    Si es doble igual y ya tenemos
    un resultado, activamos el truco.
  */

  if(
    doubleEquals &&
    accumulatedTotal !== null
  ){

    ejecutarTruco();

    lastEqualsTime = 0;

    return;
  }


  /*
    ==========================================
    IGUAL NORMAL
    ==========================================
  */

  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  if(
    currentOperator !== null &&
    previous !== null
  ){

    const operand =
      Number(current);


    const oldPrevious =
      previous;


    const result =
      calculate(
        oldPrevious,
        operand,
        currentOperator
      );


    historyEl.innerHTML +=
      `<div>
        ${formatNumber(oldPrevious)}
        ${operatorSymbol(currentOperator)}
        ${formatNumber(operand)}
        =
        ${formatNumber(result)}
      </div>`;


    current =
      String(result);


    /*
      GUARDAMOS EL TOTAL
      PARA EL DOBLE =
    */

    accumulatedTotal =
      result;


    previous = null;

    currentOperator = null;

    waitingForOperand = true;

    expressionParts = [];


    updateDisplay();


    /*
      El primer = queda registrado.
    */

    lastEqualsTime =
      now;


    return;
  }


  /*
    Si no había operación pendiente,
    el número actual es el total.
  */

  accumulatedTotal =
    Number(current);


  updateDisplay();


  lastEqualsTime =
    now;
}


/* =====================================================
   FECHA Y HORA
===================================================== */

function getTarget(){

  /*
    IMPORTANTE:

    La fecha y hora se capturan
    EXACTAMENTE cuando haces
    el doble =.

    Así no cambia mientras
    realizas el truco.
  */

  const now =
    new Date();


  const day =
    String(
      now.getDate()
    ).padStart(2,"0");


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");


  const year =
    String(
      now.getFullYear()
    );


  const hour =
    String(
      now.getHours()
    ).padStart(2,"0");


  const minute =
    String(
      now.getMinutes()
    ).padStart(2,"0");


  /*
    FORMATO:

    DDMMYYYYHHMM

    Ejemplo:

    270920260215
  */

  const targetString =
    day +
    month +
    year +
    hour +
    minute;


  return {

    number:
      Number(targetString),

    string:
      targetString,

    readable:
      `${day}/${month}/${year} ${hour}:${minute}`
  };
}


/* =====================================================
   TRUCO
===================================================== */

function ejecutarTruco(){

  let currentTotal =
    Number(accumulatedTotal);


  if(!Number.isFinite(currentTotal)){

    currentTotal =
      Number(current);

  }


  if(!Number.isFinite(currentTotal)){

    return;
  }


  /*
    CONGELAMOS FECHA Y HORA
  */

  const target =
    getTarget();


  const targetNumber =
    target.number;


  /*
    NÚMERO QUE FALTA:

    OBJETIVO - TOTAL
  */

  const missing =
    targetNumber -
    currentTotal;


  /*
    Si el número ya es superior
    al objetivo, no podemos realizar
    el truco con una suma positiva.
  */

  if(missing < 0){

    showNotice(
      "El resultado actual es demasiado alto."
    );

    return;
  }


  /*
    GUARDAMOS TODO EL ESTADO SECRETO.
  */

  magicMode = true;

  magicBase =
    currentTotal;

  magicMissing =
    missing;

  magicTarget =
    targetNumber;

  magicTargetString =
    target.string;


  /*
    AQUÍ ESTÁ LA PARTE IMPORTANTE:

    Quitamos el número anterior
    de la pantalla y ponemos
    SOLAMENTE el número que falta.
  */

  current =
    String(missing);


  previous = null;

  currentOperator = null;

  waitingForOperand = true;

  expressionParts = [];


  /*
    No mostramos ninguna pista.
  */

  expressionEl.textContent =
    "";

  resultEl.textContent =
    formatNumber(missing);
}


/* =====================================================
   AC
===================================================== */

function clearAll(){

  current = "0";

  previous = null;

  currentOperator = null;

  waitingForOperand = false;

  expressionParts = [];

  accumulatedTotal = null;


  /*
    Limpiar estado secreto.
  */

  magicMode = false;

  magicBase = null;

  magicMissing = null;

  magicTarget = null;

  magicTargetString = null;


  lastEqualsTime = 0;


  historyEl.innerHTML = "";

  expressionEl.textContent = "";

  resultEl.textContent = "0";


  document
    .querySelectorAll(".operator")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
}


/* =====================================================
   +/-
===================================================== */

function toggleSign(){

  if(current === "0")
    return;


  if(current.startsWith("-")){

    current =
      current.substring(1);

  }else{

    current =
      "-" + current;
  }


  updateDisplay();
}


/* =====================================================
   %
===================================================== */

function percent(){

  const value =
    Number(current);


  current =
    String(value / 100);


  updateDisplay();
}


/* =====================================================
   AVISO
===================================================== */

function showNotice(text){

  notice.textContent =
    text;

  notice.classList.add("show");


  setTimeout(()=>{
    notice.classList.remove("show");
  },2500);
}


/* =====================================================
   TECLADO FÍSICO
===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key >= "0" &&
      e.key <= "9"
    ){

      number(e.key);
    }


    if(e.key === "."){

      decimal();
    }


    if(e.key === "+"){

      operator("+");
    }


    if(e.key === "-"){

      operator("-");
    }


    if(e.key === "*"){

      operator("*");
    }


    if(e.key === "/"){

      e.preventDefault();

      operator("/");
    }


    if(
      e.key === "Enter" ||
      e.key === "="
    ){

      equals();
    }


    if(e.key === "Escape"){

      clearAll();
    }


    if(e.key === "%"){

      percent();
    }
  }
);


/* =====================================================
   INICIO
===================================================== */

updateDisplay();

</script>

</body>
</html>
